name: Deploy Fit Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the complete website
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build the website from this repository
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test:scan
          mkdir -p public/downloads
          git archive --format=zip HEAD -o public/downloads/boots-barkley-fit-demo-source.zip
          pnpm build
          test -s docs/index.html
          test -s docs/downloads/boots-barkley-fit-walkthrough.mp4
          test -s docs/downloads/boots-barkley-fit-demo-source.zip

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
