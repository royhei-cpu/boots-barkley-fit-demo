name: Deploy Fit Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the complete website
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Import the tested upload removal controls once
        env:
          SOURCE_ZIP_URL: https://barkley-fit-studio.lhei111.chatgpt.site/downloads/boots-barkley-fit-demo-source.zip
          SOURCE_ZIP_SHA256: e45bc1fdc2c29e7f5adb89227ff352bb5d3bb46878f23df885be5f829a1723ae
        run: |
          set -euo pipefail
          if grep -q 'function removeOwnUpload()' app/page.tsx; then
            echo 'Upload removal controls already imported.'
            exit 0
          fi
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --user-agent Codex-public-access-check \
            "$SOURCE_ZIP_URL" -o "$RUNNER_TEMP/fit-studio-source.zip"
          printf '%s  %s\n' "$SOURCE_ZIP_SHA256" "$RUNNER_TEMP/fit-studio-source.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/fit-studio-source.zip" -d "$RUNNER_TEMP/fit-studio-source"
          for source_file in app/page.tsx app/globals.css SOURCE-NOTES.md README.md; do
            cp "$RUNNER_TEMP/fit-studio-source/$source_file" "$source_file"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/globals.css SOURCE-NOTES.md README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Let visitors remove uploaded pet photos, videos and measurements'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build the website from this repository
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          mkdir -p public/downloads
          git archive --format=zip HEAD -o public/downloads/boots-barkley-fit-demo-source.zip
          pnpm build
          test -s docs/index.html
          test -s docs/downloads/boots-barkley-fit-walkthrough.mp4
          test -s docs/downloads/boots-barkley-fit-demo-source.zip

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
