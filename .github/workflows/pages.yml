name: Deploy Fit Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the complete website
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Import the tested uploaded-pet costume previews once
        env:
          SOURCE_ZIP_URL: https://barkley-fit-studio.lhei111.chatgpt.site/downloads/boots-barkley-fit-demo-source.zip
          SOURCE_ZIP_SHA256: 74b1a0f7c9f0d767fe544f9d2cfc0e1114ba7213d9275c093267f6f26fda5bcc
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --user-agent Codex-public-access-check \
            "$SOURCE_ZIP_URL" -o "$RUNNER_TEMP/fit-studio-source.zip"
          printf '%s  %s\n' "$SOURCE_ZIP_SHA256" "$RUNNER_TEMP/fit-studio-source.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/fit-studio-source.zip" -d "$RUNNER_TEMP/fit-studio-source"
          for source_path in app components lib public scripts tests docs-research scan-assets.json package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json SOURCE-NOTES.md README.md; do
            cp -R "$RUNNER_TEMP/fit-studio-source/$source_path" .
          done
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 --user-agent Codex-public-access-check 'https://barkley-fit-studio.lhei111.chatgpt.site/models/pet-lraspp-512.onnx' -o 'public/models/pet-lraspp-512.onnx'
          printf '%s  %s\n' '860c7102e56b977f60e8804bdd9773ed26c2ed287042042263ac623a90567075' 'public/models/pet-lraspp-512.onnx' | sha256sum --check --strict
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 --user-agent Codex-public-access-check 'https://barkley-fit-studio.lhei111.chatgpt.site/models/rtmpose-ap10k-fp16.part1' -o 'public/models/rtmpose-ap10k-fp16.part1'
          printf '%s  %s\n' '54efa8b15d5beb6286c155b5879ad26846a68b4f2846b69075ca547d8119a261' 'public/models/rtmpose-ap10k-fp16.part1' | sha256sum --check --strict
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 --user-agent Codex-public-access-check 'https://barkley-fit-studio.lhei111.chatgpt.site/models/rtmpose-ap10k-fp16.part2' -o 'public/models/rtmpose-ap10k-fp16.part2'
          printf '%s  %s\n' '676dc6e7d4ba92dcfcf5bbccfe1218335bb958b23b8c4f67e74ee60f26279c32' 'public/models/rtmpose-ap10k-fp16.part2' | sha256sum --check --strict
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 --user-agent Codex-public-access-check 'https://barkley-fit-studio.lhei111.chatgpt.site/scan-runtime/ort-wasm-simd-threaded.wasm' -o 'public/scan-runtime/ort-wasm-simd-threaded.wasm'
          printf '%s  %s\n' '71aef04959c5c1b6de461b6538e2058e306610034a85aad2742d0c7fd4533fe4' 'public/scan-runtime/ort-wasm-simd-threaded.wasm' | sha256sum --check --strict
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 --user-agent Codex-public-access-check 'https://barkley-fit-studio.lhei111.chatgpt.site/models/mobilenetv3-large-v2-fp16.onnx' -o 'public/models/mobilenetv3-large-v2-fp16.onnx'
          printf '%s  %s\n' '57ab69fe4bc22e48ae23d70389a202500fb48c21962abed8f2de832c3b401666' 'public/models/mobilenetv3-large-v2-fp16.onnx' | sha256sum --check --strict
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app components lib public scripts tests docs-research scan-assets.json package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json SOURCE-NOTES.md README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Preview supported costumes on uploaded pet photos and video frames'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build the website from this repository
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test:scan
          mkdir -p public/downloads
          git archive --format=zip HEAD -o public/downloads/boots-barkley-fit-demo-source.zip
          pnpm build
          test -s docs/index.html
          test -s docs/downloads/boots-barkley-fit-walkthrough.mp4
          test -s docs/downloads/boots-barkley-fit-demo-source.zip

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
